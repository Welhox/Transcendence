name: Docker Compile Check + Lint

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y make docker-compose openssl curl

    - name: Generate SSL and JWT Secret
      run: make ssl jwt-secret

    - name: Build Docker containers
      run: make all

    - name: Wait for services to start
      run: sleep 10

    # ✅ Frontend build check
    - name: Check frontend build
      id: frontend
      run: |
        set +e
        docker exec --workdir /var/www/html frontend npm run build
        echo "exit_code=$?" >> $GITHUB_OUTPUT
        set -e

    # ✅ Backend health check (does the app respond?)
    - name: Check if backend has launched
      id: backend_check
      run: |
        echo "Checking if backend container is responsive..."
        set +e
        for i in {1..10}; do
          docker exec backend curl -s -f http://localhost:3000/ping && success=true && break
          echo "Backend not responding yet... ($i/10)"
          sleep 2
        done
        if [ "$success" != "true" ]; then
          echo "❌ Backend did not become responsive in time."
          echo "exit_code=1" >> $GITHUB_OUTPUT
          exit 1
        else
          echo "✅ Backend is responsive"
          echo "exit_code=0" >> $GITHUB_OUTPUT
        fi
        set -e



    # ✅ Backend ESLint check (run regardless of backend health)
    - name: Run backend ESLint
      id: backend
      run: |
        echo "Running ESLint on backend..."
        set +e
        docker exec --workdir /backend backend sh -c "npx eslint ./srcs --ext .js,.ts > eslint_output.log 2>&1; exit_code=\$?; cat eslint_output.log; exit \$exit_code"
        echo "exit_code=$?" >> $GITHUB_OUTPUT
        set -e

    # ✅ Final decision block
    - name: Check for errors
      run: |
        FRONTEND_CODE=${{ steps.frontend.outputs.exit_code }}
        BACKEND_HEALTH_CODE=${{ steps.backend_health.outputs.exit_code }}
        BACKEND_LINT_CODE=${{ steps.backend.outputs.exit_code }}

        echo "Frontend exit code: $FRONTEND_CODE"
        echo "Backend health check exit code: $BACKEND_HEALTH_CODE"
        echo "Backend ESLint exit code: $BACKEND_LINT_CODE"

        if [ "$FRONTEND_CODE" -ne 0 ] || [ "$BACKEND_HEALTH_CODE" -ne 0 ] || [ "$BACKEND_LINT_CODE" -ne 0 ]; then
          echo "❌ One or more checks failed."
          exit 1
        else
          echo "✅ All checks passed."
        fi

    - name: Shutdown containers
      if: always()
      run: make down



